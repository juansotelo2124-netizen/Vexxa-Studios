<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXXA STUDIOS | Catálogo Oficial</title>
    <!-- Favicon / Ícono de pestaña oficial de VEXXA -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/Fb17FJCn/Whats-App-Image-2026-10-18-at-12-53-23-PM.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Fondo degradado suave descendente de blanco a negro */
        body {
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 15%, #6c757d 45%, #212529 75%, #0a0a0a 100%);
            background-attachment: fixed;
        }

        /* Renderizado suave para imágenes */
        img {
            image-rendering: auto;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* Personalización de la barra de scroll del modal */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #000000;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }

        /* Animaciones para el desplazamiento (slide) de imágenes */
        @keyframes slideLeft {
            0% { transform: translateX(30px); opacity: 0.3; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideRight {
            0% { transform: translateX(-30px); opacity: 0.3; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .anim-slide-left {
            animation: slideLeft 0.25s ease-out forwards;
        }

        .anim-slide-right {
            animation: slideRight 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-900 font-sans antialiased selection:bg-black selection:text-white min-h-screen">

    <!-- Header / Navbar con Logo e Ícono Oficial VEXXA STUDIOS -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-2">
            <!-- Logo e Ícono de la Marca -->
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/Fb17FJCn/Whats-App-Image-2026-10-18-at-12-53-23-PM.jpg" alt="VEXXA Icon" class="h-10 w-10 object-contain rounded-lg bg-black p-0.5 shadow-sm border border-black/10">
                <div class="flex items-center gap-2">
                    <span class="text-2xl font-black tracking-[0.2em] text-black">VEXXA</span>
                    <span class="text-xs text-gray-500 uppercase tracking-widest hidden sm:inline">STUDIOS</span>
                </div>
            </div>

            <!-- Botones Redes Sociales + WhatsApp -->
            <div class="flex items-center gap-2">
                <!-- Instagram -->
                <a href="https://www.instagram.com/vexxa_studios/" target="_blank" class="bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-500 hover:opacity-90 text-white font-bold p-2.5 sm:px-4 sm:py-2.5 rounded-full flex items-center gap-2 text-sm transition-all shadow-sm" title="Instagram VEXXA">
                    <i class="fab fa-instagram text-lg"></i>
                    <span class="hidden md:inline">Instagram</span>
                </a>

                <!-- TikTok -->
                <a href="https://www.tiktok.com/@vexxastudios?lang=es" target="_blank" class="bg-black hover:bg-gray-800 text-white font-bold p-2.5 sm:px-4 sm:py-2.5 rounded-full flex items-center gap-2 text-sm transition-all shadow-sm border border-gray-700" title="TikTok VEXXA">
                    <i class="fab fa-tiktok text-lg"></i>
                    <span class="hidden md:inline">TikTok</span>
                </a>

                <!-- WhatsApp -->
                <a id="btn-header-wa" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-2.5 sm:px-4 sm:py-2.5 rounded-full flex items-center gap-2 text-sm transition-all shadow-sm" title="WhatsApp VEXXA">
                    <i class="fab fa-whatsapp text-lg"></i>
                    <span class="hidden md:inline">WhatsApp</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Filtros por Categoría -->
    <div class="max-w-7xl mx-auto px-4 mt-8 mb-4 flex justify-center gap-2 flex-wrap" id="filtros">
        <button onclick="filtrarProductos('todos')" class="filter-btn bg-black text-white font-semibold px-5 py-2 rounded-full text-sm transition-all shadow-sm">Todos</button>
        <button onclick="filtrarProductos('camisetas')" class="filter-btn bg-white/70 hover:bg-white text-gray-800 font-medium px-5 py-2 rounded-full text-sm transition-all border border-gray-300 backdrop-blur-sm">Camisetas</button>
    </div>

    <!-- Catálogo de Productos -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-24">
        <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
            <!-- Renderizado dinámico -->
        </div>
    </main>

    <!-- Modal Detalle del Producto, Estilos & Tallas -->
    <div id="modal-producto" onclick="cerrarModalFuera(event)" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div id="modal-card" class="bg-black rounded-2xl max-w-xl w-full max-h-[85vh] overflow-y-auto custom-scroll border border-gray-800 relative shadow-2xl text-white my-auto">
            
            <!-- Botón X siempre visible y fijo al hacer scroll -->
            <button onclick="cerrarModal()" class="sticky top-4 float-right right-4 mr-4 bg-red-700 hover:bg-red-600 text-white w-9 h-9 rounded-full flex items-center justify-center transition-all shadow-lg z-30 border border-red-500/30">
                <i class="fas fa-times"></i>
            </button>

            <div class="p-6 pt-2 clear-both">
                <!-- Visor deslizable de detalles en el modal -->
                <div class="overflow-hidden relative bg-black rounded-xl mb-4 border border-gray-900 p-2">
                    <span id="modal-counter" class="absolute top-3 right-3 bg-black/80 text-gray-300 text-[10px] px-2 py-0.5 rounded border border-white/10 z-10">1/1</span>

                    <!-- Flecha Izquierda Modal -->
                    <button onclick="cambiarImagenModal(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/80 hover:bg-red-700 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md border border-white/10 transition-all z-10 opacity-80 hover:opacity-100">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>

                    <div class="w-full h-80 flex items-center justify-center overflow-hidden">
                        <img id="modal-img" src="" alt="" class="w-full h-auto max-h-80 object-contain bg-black rounded-lg">
                    </div>

                    <!-- Flecha Derecha Modal -->
                    <button onclick="cambiarImagenModal(1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/80 hover:bg-red-700 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md border border-white/10 transition-all z-10 opacity-80 hover:opacity-100">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
                
                <span id="modal-categoria" class="text-xs font-bold text-red-400 uppercase tracking-widest bg-red-950/50 px-2.5 py-1 rounded border border-red-900/40"></span>
                <h3 id="modal-titulo" class="text-2xl font-bold text-white mt-2"></h3>
                <p id="modal-precio" class="text-xl font-bold text-red-500 mt-1"></p>
                <p id="modal-desc" class="text-gray-300/80 text-sm mt-2 leading-relaxed"></p>

                <!-- Selección de Tipo de Camiseta (Boxy Fit / Crop Top) -->
                <div class="mt-6">
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Selecciona el Estilo de Camiseta:</label>
                    <div id="modal-tipos" class="flex gap-2 flex-wrap">
                        <!-- Botones dinámicos de estilo -->
                    </div>
                </div>

                <!-- Selección de Talla -->
                <div class="mt-5">
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Selecciona la Talla:</label>
                    <div id="modal-tallas" class="flex gap-2 flex-wrap">
                        <!-- Botones dinámicos de talla -->
                    </div>
                </div>

                <!-- Imagen de la Guía de Tallas -->
                <div class="mt-6 bg-gray-950 p-3 rounded-xl border border-white/10">
                    <p class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fas fa-ruler-combined text-red-500"></i> Guía de Tallas
                    </p>
                    <div class="overflow-hidden rounded-lg bg-white p-1">
                        <img id="modal-guia-img" src="" alt="Guía de tallas VEXXA STUDIOS" class="w-full h-auto object-contain rounded">
                    </div>
                </div>

                <!-- Botón de Pedido a WhatsApp -->
                <a id="btn-pedir-wa" href="#" target="_blank" class="mt-6 w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-red-950/60 border border-red-500/20">
                    <i class="fab fa-whatsapp text-xl"></i>
                    Pedir prenda por WhatsApp
                </a>
            </div>
        </div>
    </div>

    <script>
        const NUMERO_WHATSAPP = "+573223914243";

        const GUIA_TALLAS_DEFAULT = "https://i.ibb.co/N0Tkfjz/tallas.jpg";

        const productos = [
            {
                id: 1,
                nombre: "Camiseta Venom Kiss (Black)",
                categoria: "camisetas",
                precio: "$90.000 COP",
                descripcion: "Camiseta de alto gramaje con acabado lavado. Logo 'V' frontal en rojo con diseño drip y gráfico 'Venom Kiss' en la espalda.",
                tipos: ["Boxy Fit", "Crop Top"],
                tallas: ["S", "M", "L", "XL"],
                imagenes: [
                    "https://i.ibb.co/Fb2dvwM1/venom-kiss.jpg",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwOdaf1Pk-l0lDnsDumpBLA7VINlJdrn7dN5HxnkXl3w&s=10"
                ],
                imagenesDetalle: [
                    "https://i.ibb.co/Fb2dvwM1/venom-kiss.jpg",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRs3dVNj0RPKoAUNwJ4NB5TPF0NivAsD45sUUmOgL-c9w&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhTQY-yLSONvaNEEL8bnMqSeO5lbq696tsG0z1VBOm7A&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHQq1d7WmJ_GPUZhwV4VK6ZouH4sX0EQaif7CSBFl_0A&s=10"
                ],
                imagenGuiaTallas: GUIA_TALLAS_DEFAULT,
                imgIndex: 0,
                modalImgIndex: 0
            },
            {
                id: 2,
                nombre: "Camiseta Rematch (White)",
                categoria: "camisetas",
                precio: "$90.000 COP",
                descripcion: "Camiseta blanca de alto gramaje. Detalle tipográfico frontal vertical 'VEXXA' en tono rojo y estampado tipográfico 'REMATCH' en la espalda.",
                tipos: ["Boxy Fit", "Crop Top"],
                tallas: ["S", "M", "L", "XL"],
                imagenes: [
                    "https://i.ibb.co/VYpBPw4w/rematch.jpg",
                    "https://i.ibb.co/VYpBPw4w/rematch.jpg"
                ],
                imagenesDetalle: [
                    "https://i.ibb.co/VYpBPw4w/rematch.jpg",
                    "https://i.ibb.co/VYpBPw4w/rematch.jpg"
                ],
                imagenGuiaTallas: GUIA_TALLAS_DEFAULT,
                imgIndex: 0,
                modalImgIndex: 0
            },
            {
                id: 3,
                nombre: "Camiseta Short 'n' Sweet (White)",
                categoria: "camisetas",
                precio: "$90.000 COP",
                descripcion: "Camiseta blanca de alto gramaje. Logo tribal VEXXA en pecho y estampado de cupido en tono rosa con tipografía 'Short 'n' Sweet' en la espalda.",
                tipos: ["Boxy Fit", "Crop Top"],
                tallas: ["S", "M", "L", "XL"],
                imagenes: [
                    "https://i.ibb.co/GvVtv9Wc/cupido.jpg",
                    "https://i.ibb.co/GvVtv9Wc/cupido.jpg"
                ],
                imagenesDetalle: [
                    "https://i.ibb.co/GvVtv9Wc/cupido.jpg",
                    "https://i.ibb.co/GvVtv9Wc/cupido.jpg"
                ],
                imagenGuiaTallas: GUIA_TALLAS_DEFAULT,
                imgIndex: 0,
                modalImgIndex: 0
            }
        ];

        let productoSeleccionado = null;
        let tipoSeleccionado = "";
        let tallaSeleccionada = "";

        document.getElementById('btn-header-wa').href = `https://wa.me/${NUMERO_WHATSAPP}?text=Hola%20VEXXA%20STUDIOS,%20quiero%20más%20información.`;

        function cargarProductos(lista) {
            const grid = document.getElementById('grid-productos');
            grid.innerHTML = "";

            lista.forEach(prod => {
                grid.innerHTML += `
                    <div class="bg-black/90 backdrop-blur-sm text-white rounded-2xl overflow-hidden border border-gray-800 hover:border-black transition-all group flex flex-col justify-between shadow-2xl">
                        <div>
                            <div class="overflow-hidden relative bg-black p-4 flex items-center justify-center">
                                <span class="absolute top-3 left-3 bg-black/90 backdrop-blur-md text-red-400 text-[10px] px-2.5 py-1 rounded uppercase tracking-wider font-bold border border-red-900/30 z-10">${prod.categoria}</span>
                                
                                <button onclick="cambiarImagen(${prod.id}, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-red-700 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md border border-white/10 transition-all z-10 opacity-80 hover:opacity-100">
                                    <i class="fas fa-chevron-left text-xs"></i>
                                </button>

                                <div class="w-full h-80 flex items-center justify-center overflow-hidden">
                                    <img id="img-prod-${prod.id}" src="${prod.imagenes[prod.imgIndex]}" alt="${prod.nombre}" class="w-full h-auto max-h-80 object-contain group-hover:scale-105 transition-transform duration-500 rounded-lg cursor-pointer" onclick="abrirModal(${prod.id})">
                                </div>

                                <button onclick="cambiarImagen(${prod.id}, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-red-700 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md border border-white/10 transition-all z-10 opacity-80 hover:opacity-100">
                                    <i class="fas fa-chevron-right text-xs"></i>
                                </button>
                            </div>
                            
                            <div class="p-5">
                                <h3 class="font-bold text-lg text-white group-hover:text-red-400 transition-colors">${prod.nombre}</h3>
                                <p class="text-white font-extrabold mt-1 text-xl">${prod.precio}</p>
                            </div>
                        </div>

                        <div class="p-5 pt-0">
                            <button onclick="abrirModal(${prod.id})" class="w-full bg-gray-900 hover:bg-black hover:text-white text-gray-200 font-bold py-3 rounded-xl transition-all text-sm flex items-center justify-center gap-2 border border-gray-800">
                                <i class="fas fa-eye"></i> Seleccionar Talla y Detalles
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function cambiarImagen(prodId, direccion) {
            const prod = productos.find(p => p.id === prodId);
            prod.imgIndex += direccion;

            if (prod.imgIndex < 0) {
                prod.imgIndex = prod.imagenes.length - 1;
            } else if (prod.imgIndex >= prod.imagenes.length) {
                prod.imgIndex = 0;
            }

            const imgElement = document.getElementById(`img-prod-${prod.id}`);
            imgElement.classList.remove('anim-slide-left', 'anim-slide-right');
            void imgElement.offsetWidth;
            imgElement.classList.add(direccion > 0 ? 'anim-slide-left' : 'anim-slide-right');

            imgElement.src = prod.imagenes[prod.imgIndex];
        }

        function cambiarImagenModal(direccion) {
            if (!productoSeleccionado) return;

            productoSeleccionado.modalImgIndex += direccion;

            if (productoSeleccionado.modalImgIndex < 0) {
                productoSeleccionado.modalImgIndex = productoSeleccionado.imagenesDetalle.length - 1;
            } else if (productoSeleccionado.modalImgIndex >= productoSeleccionado.imagenesDetalle.length) {
                productoSeleccionado.modalImgIndex = 0;
            }

            const imgModal = document.getElementById('modal-img');
            imgModal.classList.remove('anim-slide-left', 'anim-slide-right');
            void imgModal.offsetWidth;
            imgModal.classList.add(direccion > 0 ? 'anim-slide-left' : 'anim-slide-right');

            imgModal.src = productoSeleccionado.imagenesDetalle[productoSeleccionado.modalImgIndex];
            actualizarContadorModal();
        }

        function actualizarContadorModal() {
            if (!productoSeleccionado) return;
            const total = productoSeleccionado.imagenesDetalle.length;
            const actual = productoSeleccionado.modalImgIndex + 1;
            document.getElementById('modal-counter').innerText = `${actual}/${total}`;
        }

        function filtrarProductos(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-white/70 hover:bg-white text-gray-800 font-medium px-5 py-2 rounded-full text-sm transition-all border border-gray-300 backdrop-blur-sm";
            });
            event.target.className = "filter-btn bg-black text-white font-semibold px-5 py-2 rounded-full text-sm transition-all shadow-sm";

            if (cat === 'todos') {
                cargarProductos(productos);
            } else {
                cargarProductos(productos.filter(p => p.categoria === cat));
            }
        }

        function abrirModal(id) {
            productoSeleccionado = productos.find(p => p.id === id);
            tipoSeleccionado = productoSeleccionado.tipos[0]; // Boxy Fit por defecto
            tallaSeleccionada = productoSeleccionado.tallas[0]; // S por defecto
            productoSeleccionado.modalImgIndex = 0;

            document.getElementById('modal-img').src = productoSeleccionado.imagenesDetalle[0];
            document.getElementById('modal-categoria').innerText = productoSeleccionado.categoria;
            document.getElementById('modal-titulo').innerText = productoSeleccionado.nombre;
            document.getElementById('modal-precio').innerText = productoSeleccionado.precio;
            document.getElementById('modal-desc').innerText = productoSeleccionado.descripcion;
            
            document.getElementById('modal-guia-img').src = productoSeleccionado.imagenGuiaTallas || GUIA_TALLAS_DEFAULT;

            actualizarContadorModal();
            renderizarTipos();
            renderizarTallas();
            actualizarBotonWA();

            document.getElementById('modal-producto').classList.remove('hidden');
            document.getElementById('modal-card').scrollTop = 0;
        }

        function cerrarModal() {
            document.getElementById('modal-producto').classList.add('hidden');
        }

        function cerrarModalFuera(e) {
            if (e.target.id === 'modal-producto') {
                cerrarModal();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModal();
            }
        });

        // Renderizado de botones para Tipo/Estilo (Boxy Fit / Crop Top)
        function renderizarTipos() {
            const contTipos = document.getElementById('modal-tipos');
            contTipos.innerHTML = "";

            productoSeleccionado.tipos.forEach(tipo => {
                const esActivo = tipo === tipoSeleccionado;
                const claseBtn = esActivo 
                    ? "bg-red-700 text-white font-bold border-red-500 shadow-lg shadow-red-950/40" 
                    : "bg-black/60 text-gray-300 border-white/10 hover:border-white/30";

                contTipos.innerHTML += `
                    <button onclick="seleccionarTipo('${tipo}')" class="px-5 py-2 border rounded-xl transition-all text-sm ${claseBtn}">
                        ${tipo}
                    </button>
                `;
            });
        }

        function seleccionarTipo(tipo) {
            tipoSeleccionado = tipo;
            renderizarTipos();
            actualizarBotonWA();
        }

        // Renderizado de botones de Talla
        function renderizarTallas() {
            const contTallas = document.getElementById('modal-tallas');
            contTallas.innerHTML = "";

            productoSeleccionado.tallas.forEach(talla => {
                const esActiva = talla === tallaSeleccionada;
                const claseBtn = esActiva 
                    ? "bg-red-700 text-white font-bold border-red-500 shadow-lg shadow-red-950/40" 
                    : "bg-black/60 text-gray-300 border-white/10 hover:border-white/30";

                contTallas.innerHTML += `
                    <button onclick="seleccionarTalla('${talla}')" class="px-5 py-2 border rounded-xl transition-all text-sm ${claseBtn}">
                        ${talla}
                    </button>
                `;
            });
        }

        function seleccionarTalla(talla) {
            tallaSeleccionada = talla;
            renderizarTallas();
            actualizarBotonWA();
        }

        function actualizarBotonWA() {
            const mensaje = encodeURIComponent(
                `¡Hola VEXXA STUDIOS! Quiero pedir la siguiente prenda:\n\n` +
                `*Prenda:* ${productoSeleccionado.nombre}\n` +
                `*Estilo:* ${tipoSeleccionado}\n` +
                `*Talla:* ${tallaSeleccionada}\n` +
                `*Precio:* ${productoSeleccionado.precio}\n\n` +
                `¿Tienen disponibilidad para envío?`
            );
            document.getElementById('btn-pedir-wa').href = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;
        }

        cargarProductos(productos);
    </script>
</body>
</html>
